
@if(countryResource.error()){
  <app-not-found />
}@if(countryResource.isLoading()) {
    <div class="flex items-center justify-center min-h-[60vh]">
        <p class="text-gray-500">Cargando...</p>
        <svg class="animate-spin h-5 w-5 text-gray-500 ml-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 1 1 16 0A8 8 0 0 1 4 12zm2.5 0a5.5 5.5 0 1 0 11 0A5.5 5.5 0 0 0 6.5 12z"></path>
        </svg>
    </div>
}

@if(countryResource.hasValue()){
    <country-info
        [country] = "countryResource.value()"
     />
}
